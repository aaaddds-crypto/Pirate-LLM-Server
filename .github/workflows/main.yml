name: Build Pirate LLM Server IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build llama.cpp XCFramework
        run: |
          chmod +x setup.sh build-llama.sh
          ./setup.sh

      - name: Archive Unsigned App
        run: |
          xcodebuild -project LLMServer.xcodeproj \
            -scheme LLMServer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r PirateLLMServer-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PirateLLMServer-IPA
          path: PirateLLMServer-unsigned.ipa
